name: Laravel MySQL Tests

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-mysql-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: laravel-mysql-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gitlearn_testing
          MYSQL_USER: laravel
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false

      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: gitlearn_testing
      DB_USERNAME: laravel
      DB_PASSWORD: secret

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, intl
          coverage: none
          tools: composer:v2

      - name: Display environment information
        run: |
          php --version
          composer --version

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Wait for MySQL
        shell: bash
        run: |
          for attempt in {1..30}; do
            if php -r '
              try {
                  new PDO(
                      "mysql:host=127.0.0.1;port=3306;dbname=gitlearn_testing",
                      "laravel",
                      "secret"
                  );
                  exit(0);
              } catch (Throwable $exception) {
                  exit(1);
              }
            '; then
              echo "MySQL is ready."
              exit 0
            fi

            echo "Waiting for MySQL... attempt ${attempt}/30"
            sleep 2
          done

          echo "MySQL did not become ready."
          exit 1

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test --stop-on-failure
